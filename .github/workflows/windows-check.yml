name: Windows feasibility check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Install locked dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install desktop packaging tools
        shell: pwsh
        run: |
          python -m pip install pywebview PyInstaller
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check desktop imports
        shell: pwsh
        run: |
          python -c "import webview; print('pywebview import: OK')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import PyInstaller; print('PyInstaller import: OK')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run tests
        shell: pwsh
        env:
          DUCKLAB_DB_PATH: ${{ runner.temp }}\windows-check.db
        run: python -m pytest tests/ -q --tb=line -rfE --continue-on-collection-errors
