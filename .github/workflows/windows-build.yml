name: Windows frozen build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock PyInstaller
      - name: Build production frontend
        shell: pwsh
        env:
          OPSCORE_DESKTOP: '1'
          DUCKLAB_DB_PATH: ${{ runner.temp }}\opscore-build.db
          DUCKLAB_RELEASE_ID: windows-${{ github.run_id }}
          REFLEX_CHECK_LATEST_VERSION: 'false'
        run: |
          Set-Content -Path RELEASE -Value 'windows-${{ github.run_id }}'
          python -m reflex export --env prod --frontend-only --no-zip
          if (-not (Test-Path .web/build/client/index.html)) { throw 'Frontend export missing' }
          if (-not (Test-Path .web/build/client/login.html)) { throw 'Login frontend export missing' }
          $raw = Get-Content .web/env.json -Raw
          $endpoints = $raw | ConvertFrom-Json
          if ($endpoints.EVENT -ne 'ws://127.0.0.1:47811/_event') { throw "Unexpected desktop endpoint: $raw" }
          if ($raw.Contains(':8000')) { throw "Development endpoint remained: $raw" }
      - name: Freeze launcher and backend
        shell: pwsh
        run: python -m PyInstaller --clean --noconfirm packaging/windows/opscore.spec
      - name: Smoke-test frozen backend
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP 'opscore-smoke-data'
          $null = New-Item -ItemType Directory -Path $data -Force
          $db = Join-Path $data 'store_ops.db'
          $envFor = @{
            LOCALAPPDATA = $data
            DUCKLAB_DB_PATH = $db
            DUCKLAB_RELEASE_ID = 'windows-smoke'
            DUCKLAB_SECURE_COOKIES = '0'
            REFLEX_STATES_WORKDIR = Join-Path $data 'states'
            REFLEX_UPLOADED_FILES_DIR = Join-Path $data 'uploaded_files'
            REFLEX_TELEMETRY_DISABLED = '1'
          }
          $process = Start-Process -FilePath (Join-Path $PWD 'dist\opscore\opscore.exe') `
            -ArgumentList '--backend' -WorkingDirectory (Join-Path $PWD 'dist\opscore') `
            -Environment $envFor -PassThru
          function Get-ProcessTree($parentId) {
            $children = Get-CimInstance Win32_Process -Filter "ParentProcessId=$parentId"
            foreach ($child in $children) {
              [int]$child.ProcessId
              Get-ProcessTree ([int]$child.ProcessId)
            }
          }
          $tree = @([int]$process.Id) + @(Get-ProcessTree ([int]$process.Id))
          try {
            $health = $null
            for ($i = 0; $i -lt 90; $i++) {
              if ($process.HasExited) { throw "Backend exited early with status $($process.ExitCode)" }
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:47811/api/health' -TimeoutSec 2
                break
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $health -or $health.status -ne 'ok') { throw 'Backend health check timed out' }
            $index = Invoke-WebRequest -Uri 'http://127.0.0.1:47811/' -TimeoutSec 10
            if ($index.StatusCode -ne 200 -or -not $index.Content) { throw 'Frontend index did not load' }
            Write-Host "Smoke test passed: $($health.release), frontend bytes $($index.RawContentLength)"
          } finally {
            cmd /c "taskkill /PID $($process.Id) /T /F >NUL 2>&1"
            Start-Sleep -Seconds 3
          }
          $remaining = @($tree | Where-Object { Get-Process -Id $_ -ErrorAction SilentlyContinue })
          if ($remaining) { throw "Process tree remains: $($remaining -join ', ')" }
      - name: Package frozen folder
        shell: pwsh
        run: Compress-Archive -Path 'dist\opscore' -DestinationPath 'dist\opscore-windows.zip' -Force
      - name: Upload frozen build
        uses: actions/upload-artifact@v4
        with:
          name: opscore-windows-${{ github.run_id }}
          path: dist/opscore-windows.zip
          if-no-files-found: error
