name: Windows installer release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  installer:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build self-contained Opscore folder
        shell: pwsh
        run: |
          $version = if ($env:OPSCORE_VERSION) {
            $env:OPSCORE_VERSION
          } elseif ($env:GITHUB_EVENT_NAME -eq 'release') {
            $release = Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
            $release.release.tag_name
          } else {
            [DateTime]::UtcNow.ToString('yyyy.MM.dd', [Globalization.CultureInfo]::InvariantCulture)
          }
          if ($version.StartsWith('v')) { $version = $version.Substring(1) }
          # This is the published release pipeline: build the release folder
          # explicitly. Candidate builds never touch these artifacts.
          .\scripts\build_windows.ps1 -Version $version -AllowReleaseOutput
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Inno Setup if needed
        shell: pwsh
        run: |
          $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if (-not $iscc) {
            winget install --exact --id JRSoftware.InnoSetup --accept-source-agreements --accept-package-agreements --silent --disable-interactivity
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed: $LASTEXITCODE" }
          }

      - name: Build installer from packaged RELEASE version
        shell: pwsh
        run: |
          $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if ($iscc) {
            $compiler = $iscc.Source
          } else {
            $compiler = @(
              (Join-Path $env:LOCALAPPDATA 'Programs\Inno Setup 6\ISCC.exe')
              (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe')
              (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe')
            ) | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          }
          if (-not $compiler) { throw 'ISCC.exe was not found after installing Inno Setup.' }
          $version = (Get-Content -LiteralPath 'dist\Opscore\RELEASE' -Raw).Trim()
          if (-not $version) { throw 'The packaged RELEASE file is empty.' }
          # The installer output name is derived from dist\Opscore\RELEASE; the
          # explicit version define asserts that the packaged version matches.
          & $compiler /DOPSCORE_VERSION=$version 'packaging\windows\opscore.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $LASTEXITCODE" }
          $installer = "dist\Opscore-Setup-$version.exe"
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) { throw "Installer missing: $installer" }
          Write-Host "Built $installer"
          "OPSCORE_INSTALLER=$((Resolve-Path -LiteralPath $installer).Path)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Attach installer to published release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release upload $env:GITHUB_REF_NAME $env:OPSCORE_INSTALLER --clobber

      - name: Upload installer artifact for manual builds
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Opscore-Setup-${{ github.run_id }}
          path: ${{ env.OPSCORE_INSTALLER }}
          if-no-files-found: error
